{{- if .Values.pd.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.prefillDeploymentName" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    component: prefill
spec:
  replicas: {{ .Values.prefill.replicas }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      component: prefill
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
        component: prefill
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostIPC: true
      containers:
      - name: prefill
        image: {{ .Values.prefill.image }}
        imagePullPolicy: {{ .Values.prefill.imagePullPolicy }}
        securityContext:
          privileged: true
        {{- if .Values.prefill.env }}
        env:
          {{- toYaml .Values.prefill.env | nindent 12 }}
        {{- end }}
        {{- if .Values.commonEnv }}
        env:
          {{- toYaml .Values.commonEnv | nindent 12 }}
        {{- end }}
        command: ["bash", "-c"]
        args:
          - |
            python3 -m sglang.launch_server \
              --model-path {{ .Values.model.path }} \
              --tp {{ .Values.prefill.args.tpSize }} \
              --pp {{ .Values.prefill.args.ppSize }} \
              {{- if .Values.prefill.args.epEnabled }}
              --enable-ep-moe \
              --enable-deepep-moe --deepep-mode normal \
              {{- end }}
              --trust-remote-code \
              --host 0.0.0.0 \
              --port {{ .Values.prefill.service.port }} \
              --mem-fraction-static {{ .Values.prefill.args.memFractionStatic }} \
              --disaggregation-mode prefill \
              --disaggregation-bootstrap-port {{ .Values.prefill.bootstrapPort }} \
              --pdlb-url http://{{ include "helm.fullname" . }}-service:{{ .Values.loadBalancer.port }} \
              --disaggregation-transfer-backend {{ .Values.pd.transferBackend }} \
              {{- range .Values.prefill.extraArgs }}
              {{ . }} \
              {{- end }}
        resources:
          limits:
            nvidia.com/gpu: {{ .Values.prefill.resources.gpu }}
          requests:
            nvidia.com/gpu: {{ .Values.prefill.resources.gpu }}
        startupProbe:
          httpGet:
            path: /health
            port: {{ .Values.prefill.service.port }}
            scheme: HTTP
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 360
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.prefill.service.port }}
            scheme: HTTP
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.prefill.service.port }}
            scheme: HTTP
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        {{- if .Values.model.pvc.enabled }}
        - name: model
          mountPath: {{ .Values.model.path }}
          subPath: {{ .Values.model.pvc.path }}
        {{- else if .Values.model.local.enabled }}
        - name: model
          mountPath: {{ .Values.model.path }}
        {{- end }}
        - name: ib
          mountPath: /dev/infiniband
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      {{- if .Values.model.pvc.enabled }}
      - name: model
        persistentVolumeClaim:
          claimName: {{ .Values.model.pvc.name }}
      {{- else if .Values.model.local.enabled }}
      - name: model
        hostPath:
          path: {{ .Values.model.local.path }}
      {{- end }}
      - name: ib
        hostPath:
          path: /dev/infiniband
{{- end }}
