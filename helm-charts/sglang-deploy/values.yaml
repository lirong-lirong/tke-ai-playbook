# LeaderWorkerSet 配置
leaderWorkerSet:
  replicas: 1
  restartPolicy: RecreateGroupOnPodRestart

# restartPolicy: Always # POD重启策略

# 镜像配置
image:
  repository: lmsysorg/sglang
  tag: latest
  pullPolicy: IfNotPresent

# 模型配置
model:
  hostPath: "/data/models"  # 主机模型路径
  mountPath: "/work/models" # 容器挂载路径

# 节点
nodeSize: 2

# 资源分配
resourcesPerNode:
  gpu: 8
  cpu: 0
  memory: 0
  # 共享内存配置
  sharedMemory: 128G


# SGLang 服务器配置
llmConfig:
  # 通用参数
  memFractionStatic: 0.85   # 显存最高占用
  tp: 8
  trustRemoteCode: true
  dpAttantion: #--enable-dp-attention  # only for deepseek https://lmsys.org/blog/2024-12-04-sglang-v0-4/#data-parallelism-attention-for-deepseek-models
  dp: 1
  torchCompile: #--enable-torch-compile # 开启torch编译优化
  torchCompileMaxBs: 8      # 最大批量大小 
  
  # Leader 专用参数
  leader:
    port: 40000
    
  # 网络配置（用于worker与leader通信）
  distInitPort: 20000


# 环境变量
env:
  # NCCL/RDMA配置
  ncclIBCudaSupport: 1
  ncclIBDisable: 0
  ncclIbGidIndex: 3
  ncclSocketIfname: eth0
  ncclDebug: INFO
  # gloo
  glooSocketIfname: eth0

# 网络配置
network:
  hostNetwork: true
  hostIPC: true
  dnsPolicy: ClusterFirstWithHostNet

# 服务配置
service:
  enabled: true
  name: llm-service-endpoint
  type: ClusterIP
  port: 40000
  targetPort: 40000

commandStr: |
  python3 -m sglang.launch_server \
    --model-path {{ .Values.model.mountPath }} \
    --mem-fraction-static "{{ .Values.llmConfig.memFractionStatic }}" \
    --tp "{{ .Values.llmConfig.tp }}" \
    --dist-init-addr $(LWS_LEADER_ADDRESS):{{ .Values.llmConfig.distInitPort }} \
    --nnodes $(LWS_GROUP_SIZE) \
    --node-rank $(LWS_WORKER_INDEX) \
    --trust-remote-code \
    --host 0.0.0.0 \
    --port "{{ .Values.llmConfig.leader.port }}" \
    {{ .Values.llmConfig.dpAttantion }} \
    {{ .Values.llmConfig.torchCompile }} \
    --torch-compile-max-bs "{{ .Values.llmConfig.torchCompileMaxBs }}" \
    --dp {{ .Values.llmConfig.dp }} 

envStr: |
  - name: NCCL_IB_CUDA_SUPPORT
    value: "{{ .Values.env.ncclIBCudaSupport }}"
  - name: NCCL_IB_DISABLE
    value: "{{ .Values.env.ncclIBDisable }}"
  - name: NCCL_IB_GID_INDEX
    value: "{{ .Values.env.ncclIbGidIndex }}"
  - name: NCCL_DEBUG
    value: "{{ .Values.env.ncclDebug }}"
  - name: GLOO_SOCKET_IFNAME
    value: "{{ .Values.env.glooSocketIfname }}"
  - name: NCCL_SOCKET_IFNAME
    value: "{{ .Values.env.ncclSocketIfname }}"

volumes: |
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: {{ .Values.resourcesPerNode.sharedMemory }}
  - name: model
    hostPath:
      path: {{ .Values.model.hostPath }}
  - name: ib
    hostPath:
      path: /dev/infiniband

volumeMounts: | 
  - name: dshm
    mountPath: /dev/shm  
  - name: model
    mountPath: {{ .Values.model.mountPath }}
  - name: ib
    mountPath: /dev/infiniband

ResourcesStr: |
  limits:
    nvidia.com/gpu: "{{ .Values.resourcesPerNode.gpu }}"
    cpu: "{{ .Values.resourcesPerNode.cpu }}"
    memory: "{{ .Values.resourcesPerNode.memory }}"
  requests:
    nvidia.com/gpu: "{{ .Values.resourcesPerNode.gpu }}"
    memory: "{{ .Values.resourcesPerNode.memory }}"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount: {}
  # # Specifies whether a service account should be created
  # create: false
  # # Automatically mount a ServiceAccount's API credentials?
  # automount: false
  # # Annotations to add to the service account
  # annotations: {}
  # # The name of the service account to use.
  # # If not set and create is true, a name is generated using the fullname template
  # name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  privileged: true


# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbeStr: |
  httpGet:
    path: /health
    port: {{ .Values.llmConfig.leader.port }}
  initialDelaySeconds: 20
  failureThreshold: 5  # 5次
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbeStr: |
  httpGet:
    path: /health
    port: {{ .Values.llmConfig.leader.port }}
  initialDelaySeconds: 20
  failureThreshold: 30  # 30次
  periodSeconds: 30
  timeoutSeconds: 5

startupProbe: |
  httpGet:
    path: /health
    port: {{ .Values.llmConfig.leader.port }}
  initialDelaySeconds: 20
  failureThreshold: 30  # 30次
  periodSeconds: 30
  timeoutSeconds: 5

nodeSelector: {}

tolerations: []

affinity: {}