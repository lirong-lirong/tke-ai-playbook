
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-service
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: 60000
  selector:
    {{- include "helm.selectorLabels" . | nindent 4 }}
    role: leader
  type: {{ .Values.service.type }}
{{- end }}