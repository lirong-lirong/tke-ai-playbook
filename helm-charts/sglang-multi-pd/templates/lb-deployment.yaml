{{- if .Values.pd.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.lbName" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
    component: loadbalancer
spec:
  replicas: {{ .Values.loadBalancer.replicas }}
  selector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
      component: loadbalancer
  template:
    metadata:
      labels:
        {{- include "helm.selectorLabels" . | nindent 8 }}
        component: loadbalancer
    spec:
      {{- if .Values.loadBalancer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.loadBalancer.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: loadbalancer
          image: {{ .Values.loadBalancer.image }}
          imagePullPolicy: {{ .Values.loadBalancer.imagePullPolicy }}
          {{- if .Values.loadBalancer.resources }}
          resources:
            {{- toYaml .Values.loadBalancer.resources | nindent 12 }}
          {{- end }}
          command: ["bash", "-c"]
          args:
            - |
              python3 -m sglang.srt.disaggregation.mini_lb \
                --host 0.0.0.0 \
                --port {{ .Values.loadBalancer.port }}
          ports:
            - containerPort: {{ .Values.loadBalancer.port }}
              name: http
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.loadBalancer.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.loadBalancer.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}