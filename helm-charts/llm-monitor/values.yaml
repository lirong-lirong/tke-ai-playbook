dcgm-exporter:
  enabled: true
  serviceMonitor:
    enabled: true
  # Add a nodeSelector to ensure the exporter only runs on nodes with GPUs.
  # Please replace `gpu: "true"` with the actual label of your GPU nodes.
    nodeSelector:
    nvidia-device-enable: "enable"
