prometheus:
  enabled: true
  server:
    enabled: true
    service:
      type: LoadBalancer
    persistentVolume:
      enabled: true
      size: "10Gi"
    extraScrapeConfigs: |
      - job_name: 'pushgateway'
        static_configs:
          - targets: ['{{ .Release.Name }}-prometheus-pushgateway:9091']
  prometheusSpec:
    serviceMonitorSelector: 
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
            - dcgm-exporter
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: true
    service:
      type: LoadBalancer
      port: 9091

grafana:
  enabled: true
  service:
    enabled: true
    type: LoadBalancer
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://{{ .Release.Name }}-prometheus-server.{{ .Release.Namespace }}.svc.cluster.local
          access: proxy
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        dcgm-exporter:
          file: dashboards/dcgm-exporter-dashboard.json

dcgm-exporter:
  enabled: true
  serviceMonitor:
    enabled: true