kube-prometheus-stack:
  enabled: true
  # --- Use kube-prometheus-stack configuration ---
  # This replaces the simple prometheus server with full kube-prometheus-stack
  
  # Disable components we don't need
  grafana:
    enabled: false
  alertmanager:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  kube-state-metrics:
    enabled: false

  # Global Image Registry
  global:
    imageRegistry: ""

  # Image override section for offline installation
  prometheusOperator:
    image:
      registry: fanjiankong-bj.tencentcloudcr.com
      repository: pengdrumli/prometheus-operator
      tag: v0.73.0
      pullPolicy: IfNotPresent

    prometheusConfigReloader:
      image:
        registry: fanjiankong-bj.tencentcloudcr.com
        repository: pengdrumli/prometheus-config-reloader
        tag: v0.73.0
        pullPolicy: IfNotPresent

    admissionWebhooks:
      patch:
        enabled: true
        image:
          registry: fanjiankong-bj.tencentcloudcr.com
          repository: pengdrumli/kube-webhook-certgen
          tag: v20221220-controller-v1.5.1-58-g787ea74b6
          pullPolicy: IfNotPresent
      create:
        enabled: true
        image:
          registry: fanjiankong-bj.tencentcloudcr.com
          repository: pengdrumli/kube-webhook-certgen
          tag: v20221220-controller-v1.5.1-58-g787ea74b6
          pullPolicy: IfNotPresent

  # Core Prometheus Configuration
  prometheus:
    enabled: true

    service:
      type: LoadBalancer
      port: 9090

    prometheusSpec:
      # Image for the main Prometheus server
      image:
        registry: fanjiankong-bj.tencentcloudcr.com
        repository: pengdrumli/prometheus
        tag: v2.51.2
        pullPolicy: IfNotPresent

      # This allows Prometheus to discover ServiceMonitors in any namespace.
      serviceMonitorSelectorNilUsesHelmValues: false

      # DCGM Exporter ServiceMonitor configuration
      # The namespaceSelector is removed to restrict scraping to the chart's release namespace.
      additionalServiceMonitors:
        - name: "dcgm-exporter"
          selector:
            matchLabels:
              app: dcgm-exporter
          endpoints:
            - port: "metrics"
              interval: "5s"
              path: "/metrics"

        - name: "pushgateway"
          selector:
            matchLabels:
              app: prometheus-pushgateway
          endpoints:
            - port: "http"
              interval: "30s"

      # Configuration for the Prometheus server's PersistentVolumeClaim (PVC).
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "cfs-turbo"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

  # Keep pushgateway for compatibility
  prometheus-pushgateway:
    enabled: true
    service:
      type: LoadBalancer
      port: 9091

grafana:
