apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: model-pressure-test-
  namespace: default
spec:
  serviceAccountName: model-test-runner
  entrypoint: main
  volumes:
  - name: shared-pvc
    persistentVolumeClaim:
      claimName: shared-pvc  # 保存 reports
  - name: model-pvc-map
    configMap:
      name: model-pvc-config  # 提供模型到pvc的映射关系
  - name: test-parameters-config # 定义测试参数
    configMap:
      name: test-parameters-config

  arguments:
    parameters:
    - name: chart_path
      value: "/shared-data/helm-chart"
    - name: model_timeout
      value: "3000"  # 模型部署超时时间（秒）如果开启torch编译会更耗时
    - name: test_timeout
      value: "7200"  # 测试超时时间（秒）
    - name: max_retries
      value: "1"  # 最大重试次数

  parallelism: 1
  templates:
  - name: main
    steps:
    - - name: prepare-pvc
        template: prepare-pvc
    - - name: generate-test-matrix
        templateRef:
          name: genrate-config
          template: genrate-config
          clusterScope: true
    - - name: run-all-tests
        template: test-loop
        arguments:
          parameters:
          - name: test_config
            value: "{{item}}"
        withParam: "{{steps.generate-test-matrix.outputs.result}}"
    - - name: consolidate-reports
        templateRef:
          name: consolidate-reports
          template: consolidate-reports
          clusterScope: true
    # - - name: notify
    #     template: notify

  # 准备PVC内容
  - name: prepare-pvc
    container:
      image: alpine:3.18
      command: [sh, -c]
      args:
        - |
          # # 创建目录结构
          mkdir -p /shared-data/helm-chart
          mkdir -p /shared-data/reports
          mkdir -p /shared-data/failed-tests
          
          # 检查Chart是否存在
          if [ ! -d "{{workflow.parameters.chart_path}}" ]; then
            echo "ERROR: Helm chart not found at {{workflow.parameters.chart_path}}"
            exit 1
          else
            echo "Helm chart found at {{workflow.parameters.chart_path}}"
          fi
          
          # 设置权限
          chmod -R 777 /shared-data
      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data

  # 测试循环模板
  - name: test-loop
    inputs:
      parameters:
      - name: test_config
    retryStrategy:
      limit: "{{workflow.parameters.max_retries}}"
      retryPolicy: "Always"
    steps:
    - - name: deploy-model
        templateRef:
          name: deploy-model
          template: deploy-model
          clusterScope: true
        arguments:
          parameters:
          - name: config
            value: "{{inputs.parameters.test_config}}"
          - name: chart_path
            value: "{{workflow.parameters.chart_path}}"
          - name: model_timeout
            value: "{{workflow.parameters.model_timeout}}"
          - name: max_retries
            value: "{{workflow.parameters.max_retries}}"

    # 等待模型就绪
    - - name: wait-model-ready
        templateRef:
          name: wait-resource-operator
          template: wait-for-resource
          clusterScope: true
        arguments:
          parameters:
          - name: resource_type
            value: "statefulset"
          - name: resource_name
            value: "{{steps.deploy-model.outputs.parameters.release_name}}"
          - name: timeout
            value: "{{workflow.parameters.model_timeout}}"
          - name: pre_status
            value: "{{steps.deploy-model.outputs.parameters.status_code}}"
          - name: namespace
            value: "{{workflow.namespace}}"
        # when: "{{steps.deploy-model.outputs.parameters.status_code}} == true"

    - - name: run-pressure-test
        templateRef:
          name: pressure-test-operator
          template: pressure-test
          clusterScope: true
        arguments:
          parameters:
          - name: config
            value: "{{inputs.parameters.test_config}}"
          - name: release_name
            value: "{{steps.deploy-model.outputs.parameters.release_name}}"
          - name: pre_status
            value: "{{steps.wait-model-ready.outputs.parameters.status_code}}"
          - name: test_timeout
            value: "{{workflow.parameters.test_timeout}}"
          - name: helm_chart_path
            value: "/shared-data/helm-chart/vllm-benchmark"
          - name: workflow_name
            value: "{{workflow.name}}"
          - name: namespace
            value: "{{workflow.namespace}}"
        # when: "{{steps.wait-model-ready.outputs.parameters.status_code}} == true"

    # 监控测试Job状态
    - - name: monitor-test-job
        templateRef:
          name: wait-resource-operator
          template: wait-for-resource
          clusterScope: true
        arguments:
          parameters:
          - name: resource_type
            value: "job"
          - name: resource_name
            value: "{{steps.deploy-model.outputs.parameters.release_name}}-test"
          - name: timeout
            value: "{{workflow.parameters.test_timeout}}"
          - name: pre_status
            value: "{{steps.run-pressure-test.outputs.parameters.status_code}}"
        # when: "{{steps.run-pressure-test.outputs.parameters.status_code}} == true"

    - - name: cleanup
        templateRef:
          name: cleanup-operator
          template: cleanup-resources
          clusterScope: true
        arguments:
          parameters:
          - name: release_name
            value: "{{steps.deploy-model.outputs.parameters.release_name}}"
          - name: namespace
            value: "{{workflow.namespace}}"
          - name: cleanup_strategy
            value: "aggressive" 
          - name: delete_pvcs
            value: "false"

    - - name: handle-deploy-failure
        template: handle-failure
        arguments:
          parameters:
          - name: config
            value: "{{inputs.parameters.test_config}}"
          - name: release_name
            value: "{{steps.deploy-model.outputs.parameters.release_name}}"
          - name: error_reason
            value: "Deployment failed"
        when: "{{steps.deploy-model.outputs.parameters.status_code}} == false || 
                {{steps.wait-model-ready.status}} == false || 
                {{steps.monitor-test-job.status}} == false "

  # 处理失败情况
  - name: handle-failure
    inputs:
      parameters:
      - name: config
      - name: release_name
      - name: error_reason
    container:
      image: alpine/k8s:1.30.14
      command: [sh, -c]
      args:
        - |
          # 解析配置
          CONFIG='{{inputs.parameters.config}}'
          MODEL_PATH=$(echo "$CONFIG" | jq -r '.deployment.model')
          ENGINE=$(echo "$CONFIG" | jq -r '.deployment.engine')
          MODEL_NAME=$(basename "$MODEL_PATH")  

          # 记录失败信息
          FAIL_DIR="/shared-data/failed-tests/{{workflow.name}}"
          mkdir -p $FAIL_DIR
          
          # 创建失败报告
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FAIL_FILE="$FAIL_DIR/${MODEL_NAME}_${ENGINE}_${TIMESTAMP}.json"
          
          echo "Recording failed test: $MODEL_NAME-$ENGINE"
          echo "$CONFIG" > $FAIL_FILE
          echo "{\"error\": \"{{inputs.parameters.error_reason}}\"}" >> $FAIL_FILE
          
          # 尝试清理资源
          release_name="{{inputs.parameters.release_name}}"
          if [ -n "$release_name" ]; then
            echo "Attempting to clean up failed deployment: $release_name"
            helm uninstall $release_name || true
            kubectl delete pods -l app.kubernetes.io/instance=$release_name --force --grace-period=0 || true
          fi
          
          echo "Marked test as failed and cleaned up resources"
      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data

