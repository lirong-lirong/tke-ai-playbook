apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: cfs-turbo

---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-shared-pvc
  namespace: default
spec:
  template:
    spec:
      volumes:
      - name: shared-pvc
        persistentVolumeClaim:
          claimName: shared-pvc
      # 添加hostPath卷访问节点文件系统
      - name: node-data
        hostPath:
          path: /path/to/upload  # 替换为节点上的实际目录路径
          type: Directory      # 确保目录存在
      containers:
      - name: init
        image: alpine:3.18
        command: ["sh", "-c"]
        args:
          - |
            # 创建目录结构
            mkdir -p /shared-data/helm-chart
            mkdir -p /shared-data/reports
            mkdir -p /shared-data/temp
            
            # 设置权限
            chmod -R 777 /shared-data
            
            # 新增：拷贝节点目录到PVC
            echo "开始从节点拷贝数据..."
            cp -R /node-data/* /shared-data/  # 递归拷贝整个目录
            echo "节点数据拷贝完成"
            
            # 验证拷贝结果（可选）
            ls -l /shared-data/
            
            echo "PVC初始化完成"
        volumeMounts:
        - name: shared-pvc
          mountPath: /shared-data
        # 挂载hostPath卷
        - name: node-data
          mountPath: /node-data
      restartPolicy: Never
      # 可选：限制在特定节点运行（如果需要指定节点）
      nodeSelector:
        kubernetes.io/hostname: nodename  # 替换为实际节点名
  backoffLimit: 0