apiVersion: v1
kind: ConfigMap
metadata:
  name: test-parameters-config
  namespace: default # 确保与工作流命名空间一致
data:
  models: '["Qwen/Qwen3-32B", "deepseek-ai/DeepSeek-V3-0324", "deepseek-ai/DeepSeek-R1-0528"]' # "Qwen/Qwen3-32B", "deepseek-ai/DeepSeek-V3-0324"
  engines: '["sglang"]' # , "vllm"
  node_size: '[2]'
  gpu_per_node: '[8]' 
  tp: '[16, 8]'
  ISL: "(0 0 0)"  # "(3000 1000 1500)"
  OSL: "(250 500 1000)"
  concurrency: "1 4 16 32 64 128"
  MOE: "true"
  ep: '[2, 4, 8, 16, 1]'
  dp_attention: "true"
  # 自定义数据集相关的配置 
  useCustomDataset: "true" # "true" or "false" 
  customDatasetPath: "agent-format.jsonl" # 数据集在独立PVC上的完整路径
  customDatasetPvcName: "custom-dataset-pvc" # 独立数据集PVC的名称