# This file defines the test scenarios for the model pressure test workflow.

# Common parameters that are shared across all scenarios.
common:
  metadata:
    gpu_info: "A100-80G"
    node_size: 1
    gpu_per_node: 8
  
  # Default model and engine lists for cartesian product.
  # A scenario can override these lists.
  models: 
    - "Qwen/Qwen3-32B"
    - "deepseek-ai/DeepSeek-V3-0324"
  engines: 
    - "sglang"
    # - "vllm"

  # Storage configurations
  pvc_enable: false
  local_enable: true
  pvc_name: "default-ai-model-pvc"
  local_path: "/data0/"

  # Common test parameters
  test:
    tokenizer_from_model: true # If true, tokenizer path will be the same as model name
    isl: 1024
    osl: 2048
    dataset: "random"
    dataset_path: ""
    eos: true
    concurrency: [1, 8, 16, 32, 64, 128]
    requests: 5

# A list of specific test scenarios to execute.
scenarios:
  # Scenario 1: A standard non-PD regression test for 16 GPUs.
  # It will use the common models and engines, generating 2*2=4 configs.
  - name: "regression-16g-non-pd"
    pd_enable: false
    node_size: 2
    gpu_per_node: 8
    tp: 8
    pp: 2
    replicas: 1

  # Scenario 2: A specific test for Llama3 on vLLM with a different TP/PP split.
  # It overrides the common models/engines lists.
  - name: "llama3-vllm-tp4-pp4"
    models: ["meta-llama/Llama-3-8B-Instruct"]
    engines: ["vllm"]
    pd_enable: false
    node_size: 2
    gpu_per_node: 8
    tp: 4
    pp: 4
    replicas: 1

  # Scenario 3: A PD-Disaggregation test for DeepSeek on sglang.
  - name: "deepseek-sglang-pd"
    models: ["deepseek-ai/DeepSeek-V2-Chat"]
    engines: ["sglang"]
    pd_enable: true
    node_size: 2
    gpu_per_node: 8
    pd_prefill_replicas: 1
    pd_decode_replicas: 2
    pd_prefill_tp: 4
    pd_decode_tp: 2
    pd_prefill_pp: 1
    pd_decode_pp: 2
