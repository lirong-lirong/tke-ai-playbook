---
# 功能说明: 生成压力测试的参数组合
# 参数说明:
#   genrate-config 模板参数说明:
#         models: 模型路径
#         engines: 推理引擎
#         node_size:  节点数量 
#         gpu_per_node: 每节点gpu （实际上是resource requests 和 limits，每节点gpu使用数量由tp决定）
#         tp: 张量并行
#         ISL, OSL:  测试的输入/输出序列长度
#         concurrency: 测试的请求并发数量
# 详细说明:
#   使用python将以上参数进行参数组合，最后以json的形式输出，请捕获std的内容。因为目前经常需要增减参数，因此暂时不包装成镜像
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: genrate-config
spec:
  entrypoint: genrate-config
  templates:
  - name: genrate-config
    script:
      image: python:3.9-slim
      imagePullPolicy: Always
      command: [python]
      source: |
        import json
        import itertools
        import os

        CONFIG_MAP_MOUNT_PATH = "/etc/test-parameters" 

        # 读取挂载文件中参数的辅助函数
        def read_param_from_configmap(param_name, default_value='[]'):
            file_path = os.path.join(CONFIG_MAP_MOUNT_PATH, param_name)
            if os.path.exists(file_path):
                try:
                    with open(file_path, 'r', encoding='utf-8') as f:
                        content = f.read().strip()
                        # If content is empty, return default parsed JSON
                        if not content:
                            return json.loads(default_value)
                        return json.loads(content)
                except json.JSONDecodeError as e:
                    print(f"Error decoding JSON from {file_path}: {e}. Returning default value.")
                    return json.loads(default_value)
                except Exception as e:
                    print(f"Error reading {file_path}: {e}. Returning default value.")
                    return json.loads(default_value)
            return json.loads(default_value) # Return default value as parsed JSON

        # 从 ConfigMap 挂载文件获取配置        
        models = read_param_from_configmap('models')
        engines = read_param_from_configmap('engines')
        node_size = read_param_from_configmap('node_size')
        gpu_per_node = read_param_from_configmap('gpu_per_node', '[8]') # Provide default value
        tp_list = read_param_from_configmap('tp')
        ep_enable_list = read_param_from_configmap('ep_enable', '[false]') # 只有true或false
        dp_attention_enable = read_param_from_configmap('dp_attention', '[]')
        dp_list = read_param_from_configmap('dp')
        test_isl = read_param_from_configmap('ISL')
        test_osl = read_param_from_configmap('OSL')
        test_dataset = read_param_from_configmap('dataset')
        test_dataset_path = read_param_from_configmap('dataset_path')
        test_eos = read_param_from_configmap('EOS') # 'true' or 'false'
        test_service = read_param_from_configmap('service')
        test_service_port = read_param_from_configmap('service_port')

        def is_valid(model, node_size, gpu_per_node, tp, ep_enable):
            total_gpu = node_size * gpu_per_node
            # 1. TP必须整除总GPU数
            if total_gpu % tp != 0:
                return False, "TP must divide total GPU count"
            # 2. 特定模型的GPU数量要求
            if "deepseek" in model.lower() and (total_gpu < 8 or tp < 8):
                return False, "DeepSeek models require at least 8 GPUs"
            # 3. 非MOE模型不开启EP并行 (ep_enable 为 true 时 ep 会等于 tp)
            # 只有当 ep_enable 为 true 且不是 DeepSeek 模型时才返回 False
            if not "deepseek" in model.lower() and ep_enable:
                return False, "EP parallelism is not allowed for non-DeepSeek models when ep_enable is true"
            return True, ""

        # 生成所有组合
        combinations = []
        for m, e, ns, gpn, tp_val, ep_enabled, dp_val in itertools.product(
            models, engines, node_size, gpu_per_node, tp_list, ep_enable_list, dp_list
        ):
            # 根据 ep_enabled 的值设置 ep
            ep_val = tp_val if ep_enabled else 1
            
            valid, reason = is_valid(m, ns, gpn, tp_val, ep_enabled)
            if not valid:
                continue
            combinations.append({
                "model": m,
                "engine": e,
                "node_size": ns,
                "gpu_per_node": gpn,
                "tp": tp_val,
                "ep": ep_val,  # ep 的值根据 ep_enabled 确定
                "ep_enable": ep_enabled,
                "dp": dp_val,
            }) 

        test_configs = []
        for combo in combinations:
            model_short_name = combo["model"].split('/')[-1]
            # dp_attention_val 应该基于模型的类型和 dp_attention_enable 的原始值来设置
            # 原脚本中 dp_attention_enable 是一个列表，这里需要处理一下
            # 如果 dp_attention_enable 列表不为空，则取其第一个值，否则默认为 False
            effective_dp_attention_enable = dp_attention_enable[0] if dp_attention_enable else False

            is_deepseek = "deepseek" in combo["model"].lower()
            if is_deepseek:
                # 对于 DeepSeek 模型，dp_attention 的值取决于 read_param_from_configmap 读取到的值
                dp_attention_val = effective_dp_attention_enable
            else:
                # 对于非 DeepSeek 模型，dp_attention 恒为 False
                dp_attention_val = False

            deployment_name = f"{model_short_name}-{combo['engine']}-node{combo['node_size']}-tp{combo['tp']}-dp{combo['dp']}-ep{combo['ep']}-isl{test_isl}-osl{test_osl}-eos{test_eos}".replace('.', '-').replace('/', '-')

            test_configs.append({
                "deployment": {
                    "name": deployment_name,
                    "model": combo["model"],
                    "engine": combo["engine"],
                    "node_size": combo["node_size"],
                    "tp": combo["tp"],
                    "dp": combo["dp"], # dp 应该直接使用 combo['dp'] 的值
                    "ep": combo["ep"],
                    "gpu_per_node": combo["gpu_per_node"],
                    "replicas": 1,
                    "shared_memory": "256Gi",
                    "mem_fraction_static": 0.85,
                    "host_path": combo["model"],
                    "mount_path": "/work/models",
                    "ep_enable": combo["ep_enable"], # 使用组合中确定的 ep_enable 值
                    "dp_attention": dp_attention_val
                },
                "test": {
                    "tokenizer": combo["model"],
                    "ISL": int(test_isl),
                    "OSL": int(test_osl),
                    "dataset": test_dataset,
                    "dataset_path": test_dataset_path,
                    "EOS": True if str(test_eos).lower() == 'true' else False, # 确保 EOS 是布尔值
                    "service": test_service,
                    "service_port": int(test_service_port)
                }
            })
        # 输出JSON数组
        print(json.dumps(test_configs, indent=4))
      volumeMounts:
      - name: test-parameters-config
        mountPath: /etc/test-parameters