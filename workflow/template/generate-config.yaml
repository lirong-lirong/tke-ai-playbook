---
# 功能说明: 生成压力测试的参数组合
# 参数说明:
#   genrate-config 模板参数说明:
#         models: 模型路径
#         engines: 推理引擎
#         node_size:  节点数量 
#         gpu_per_node: 每节点gpu （实际上是resource requests 和 limits，每节点gpu使用数量由tp决定）
#         tp: 张量并行
#         ISL, OSL:  测试的输入/输出序列长度
#         concurrency: 测试的请求并发数量
# 详细说明:
#   使用python将以上参数进行参数组合，最后以json的形式输出，请捕获std的内容。因为目前经常需要增减参数，因此暂时不包装成镜像
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: genrate-config
spec:
  entrypoint: genrate-config
  templates:
  - name: genrate-config
    outputs:
      parameters:
      - name: configs
        valueFrom:
          path: /tmp/output
    script:
      image: python:3.9-slim
      imagePullPolicy: Always
      command: [sh, -c]
      source: |
        pip install -i https://mirrors.cloud.tencent.com/pypi/simple pyyaml
        python /scripts/generate_config.py
      volumeMounts:
      - name: scripts
        mountPath: /scripts
      - name: test-parameters-config
        mountPath: /etc/test-parameters