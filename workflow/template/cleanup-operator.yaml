apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: cleanup-operator
spec:
  entrypoint: cleanup-resources
  arguments:
    parameters:
    - name: release_name
    - name: namespace
      default: "default"
    - name: cleanup_strategy
      default: "standard"  # 支持: standard, aggressive, minimal
    - name: delete_pvcs
      default: "false"
  
  templates:
  - name: cleanup-resources
    inputs:
      parameters:
      - name: release_name
      - name: namespace
      - name: cleanup_strategy
      - name: delete_pvcs
    container:
      image: alpine/k8s:1.30.14
      command: [sh, /scripts/cleanup_resources.sh]
      env:
        - name: RELEASE_NAME
          value: "{{inputs.parameters.release_name}}"
        - name: NAMESPACE
          value: "{{inputs.parameters.namespace}}"
        - name: CLEANUP_STRATEGY
          value: "{{inputs.parameters.cleanup_strategy}}"
        - name: DELETE_PVCS
          value: "{{inputs.parameters.delete_pvcs}}"
      volumeMounts:
      - name: scripts
        mountPath: /scripts