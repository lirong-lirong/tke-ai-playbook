---
# 功能说明: 部署模型
# 参数说明:
#   deploy-model 模板参数说明:
#         config: 参数组合, json格式 ：
#            {
#              "deployment": {
#                    "model": ,
#                    "engine": ,
#                    "node_size": ,
#                    "tp": ,
#                    "dp": ,
#                    "gpu_per_node": ,
#                    "replicas": ,
#                    "shared_memory": "128Gi",
#                    "mem_fraction_static": 0.85,
#                    "host_path": ,
#                    "mount_path": "
#                },
#                "test": {
#                    "model": ,
#                    "tokenizer": 
#                }
#              }
# 输出:
#   release_name:
#   status_code:
# 详细说明:
#   根据配置参数部署模型
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: deploy-model
spec:
  entrypoint: deploy-model
  arguments:
    parameters:
    - name: config
    - name: chart_path
    - name: model_timeout
    - name: max_retries
  templates:
  - name: deploy-model
    inputs:
      parameters:
      - name: config
      - name: chart_path
      - name: model_timeout
      - name: max_retries
    outputs:
      parameters:
      - name: release_name
        valueFrom:
          path: /tmp/release_name
      - name: status_code
        valueFrom:
          path: /tmp/status_code
    retryStrategy:
      limit: "{{inputs.parameters.max_retries}}"
      retryPolicy: "OnFailure"
    container:
      image: alpine/k8s:1.30.14 
      command: [sh, -c]
      args:
        - |
          # 解析配置参数
          CONFIG='{{inputs.parameters.config}}'
          MODEL=$(echo "$CONFIG" | jq -r '.deployment.model')
          ENGINE=$(echo "$CONFIG" | jq -r '.deployment.engine')
          NODE_SIZE=$(echo "$CONFIG" | jq -r '.deployment.node_size')
          TP=$(echo "$CONFIG" | jq -r '.deployment.tp')
          GPU=$(echo "$CONFIG" | jq -r '.deployment.gpu_per_node')
          
          # 生成唯一测试ID
          ARGO_POD_NAME="{{pod.name}}"
          TEST_ID="$ENGINE-${ARGO_POD_NAME: -20}"  # 截取后20个字符
          echo $TEST_ID > /tmp/release_name
          
          # 记录开始时间
          START_TIME=$(date +%s)
          
          # Helm部署命令
          echo "[Deploy-Model] Starting deployment: $MODEL"
          echo "  Engine: $ENGINE, Nodes: $NODE_SIZE, GPUs/node: $GPU, TP: $TP"
          echo "  Chart path: {{inputs.parameters.chart_path}}/$ENGINE-deploy"
          echo "  Timeout: {{inputs.parameters.model_timeout}}s"
          
          set +e
          helm install $TEST_ID "{{inputs.parameters.chart_path}}"/$ENGINE-deploy  \
            --set nodeSize=$NODE_SIZE \
            --set resourcesPerNode.gpu=$GPU \
            --set llmConfig.tp=$TP \
            --set llmConfig.dp=1 \
            --set model.hostPath=$MODEL \
            --set leaderWorkerSet.restartPolicy=RecreateGroupOnPodRestart \
            --set restartPolicy=Always \
            --timeout {{inputs.parameters.model_timeout}}s \
            --atomic
          
          DEPLOY_EXIT_CODE=$?
          set +e
          
          # 记录部署结果
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            echo "Deployment failed for model: $MODEL after $DURATION seconds"
            # 记录失败信息
            FAIL_DIR="/shared-data/failed-tests/{{workflow.name}}"
            mkdir -p $FAIL_DIR
            echo "$CONFIG" > $FAIL_DIR/$TEST_ID-failed.json
            echo "Deployment failed after $DURATION seconds" >> $FAIL_DIR/$TEST_ID-failed.json
            echo "----------------------------"
            echo "false" > /tmp/status_code
          else
            echo "Successfully deployed model: $MODEL in $DURATION seconds"
            echo "----------------------------"
            echo "success" > /tmp/status_code
          fi
      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data
