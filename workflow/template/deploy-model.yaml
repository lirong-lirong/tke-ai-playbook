---
# 功能说明: 部署模型
# 参数说明:
#   deploy-model 模板参数说明:
#
# 输出:
#   release_name:
#   status_code:
# 详细说明:
#   根据配置参数部署模型
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: deploy-model
spec:
  entrypoint: deploy-model
  arguments:
    parameters:
    - name: config
    - name: chart_path
    - name: model_timeout
    - name: max_retries
  templates:
  - name: deploy-model
    inputs:
      parameters:
      - name: config
      - name: chart_path
      - name: model_timeout
      - name: max_retries
    outputs:
      parameters:
      - name: release_name
        valueFrom:
          path: /tmp/release_name
      - name: status_code
        valueFrom:
          path: /tmp/status_code
      - name: values_yaml
        valueFrom:
          path: /tmp/values.yaml
    retryStrategy:
      limit: "{{inputs.parameters.max_retries}}"
      retryPolicy: "OnFailure"
    container:
      # image: python:3.10-slim
      image: alpine/k8s:1.30.14 
      command: ["python", "-c"]
      env:
        - name: ARGO_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      args:
        - |
          import json
          import os
          import subprocess
          import sys
          print('[deploy model]')
          def write_and_exit(status_code, message, exit_code=0):
              print(message, file=sys.stderr)
              with open('/tmp/status_code', 'w') as f:
                  f.write(str(status_code).lower())
              sys.exit(exit_code)

          try:
              # 1. Load config from Argo parameter
              config_json_str = '''{{inputs.parameters.config}}'''
              config = json.loads(config_json_str)

              # 2. Locate the chart's values generator script
              chart_path = '''{{inputs.parameters.chart_path}}'''
              helm_chart_name = config.get('helm', {}).get('name')
              full_chart_path = os.path.join(chart_path, helm_chart_name)
              values_generator_script = os.path.join(full_chart_path, 'scripts', 'generate-values.sh')

              if not os.path.isfile(values_generator_script):
                  write_and_exit(False, f"[Deploy-Model] Error: Values generator script not found at {values_generator_script}")

              # 3. Execute the script to generate Helm values
              config_tmp_path = '/tmp/config.json'
              with open(config_tmp_path, 'w') as f:
                  json.dump(config, f)
              
              result = subprocess.run(
                  ['bash', values_generator_script, config_tmp_path],
                  capture_output=True, text=True
              )

              if result.returncode != 0:
                  write_and_exit(False, f"[Deploy-Model] Error: generate-values.sh failed with code {result.returncode}\n{result.stderr}")
              
              generated_values = result.stdout
              values_tmp_path = '/tmp/values.yaml'
              with open(values_tmp_path, 'w') as f:
                  f.write(generated_values)

              # # 4. Update the main config with the generated values
              # generated_values = generated_values.replace('\n', ' ').replace('\r', '')  # Remove newlines and carriage returns
              # print(generated_values)
              # config['helm']['values'] = generated_values
              # with open('/tmp/updated-config.json', 'w') as f:
              #     # Dump as a compact, single-line JSON to avoid issues with multi-line
              #     # strings when passing parameters between Argo steps.
              #     # json.dump will correctly escape newlines and quotes.
              #     json.dump(config, f, separators=(',', ':'))

              # 5. Sanitize the release name for Helm
              argo_pod_name = os.getenv('ARGO_POD_NAME', 'local-pod')
              # The original shell script had: RELEASE_NAME="$HELM_CHART_NAME-${ARGO_POD_NAME: -20}"
              # We will replicate this logic in Python.
              release_name = f"{helm_chart_name}-{argo_pod_name[-20:]}"
              with open('/tmp/release_name', 'w') as f:
                  f.write(release_name)

              # 6. Execute Helm install

              helm_args = [
                  'helm', 'install', release_name, full_chart_path,
                  '-f', values_tmp_path,
                  '--timeout', f"{{inputs.parameters.model_timeout}}s",
                  '--atomic'
              ]
              
              print(f"[Deploy-Model] Executing: {' '.join(helm_args)}")
              helm_result = subprocess.run(helm_args, capture_output=True, text=True)

              if helm_result.returncode != 0:
                  write_and_exit(False, f"[Deploy-Model] Error: Helm install failed.\nSTDOUT:\n{helm_result.stdout}\nSTDERR:\n{helm_result.stderr}")

              print(f"[Deploy-Model] Successfully deployed release: {release_name}")
              with open('/tmp/status_code', 'w') as f:
                  f.write('true')

          except json.JSONDecodeError as e:
              write_and_exit(False, f"[Deploy-Model] Error: Invalid input JSON. {e}")
          except Exception as e:
              write_and_exit(False, f"[Deploy-Model] An unexpected error occurred: {e}")
      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data
      - name: model-pvc-map
        mountPath: /etc/config/model-pvc-map
