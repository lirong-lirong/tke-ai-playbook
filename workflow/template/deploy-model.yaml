---
# 功能说明: 部署模型
# 参数说明:
#   deploy-model 模板参数说明:
#         config: 参数组合, json格式 ：
#            {
#              "deployment": {
#                    "model": ,
#                    "engine": ,
#                    "node_size": ,
#                    "tp": ,
#                    "dp": ,
#                    "gpu_per_node": ,
#                    "replicas": ,
#                    "shared_memory": "128Gi",
#                    "mem_fraction_static": 0.85,
#                    "host_path": ,
#                    "mount_path": "",
#                    "ep_enable": true/false, 
#                    "dp_attention": true/false
#                },
#                "test": {
#                    "model": ,
#                    "tokenizer": 
#                }
#              }
# 输出:
#   release_name:
#   status_code:
# 详细说明:
#   根据配置参数部署模型
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: deploy-model
spec:
  entrypoint: deploy-model
  arguments:
    parameters:
    - name: config
    - name: chart_path
    - name: model_timeout
    - name: max_retries
  templates:
  - name: deploy-model
    inputs:
      parameters:
      - name: config
      - name: chart_path
      - name: model_timeout
      - name: max_retries
    outputs:
      parameters:
      - name: release_name
        valueFrom:
          path: /tmp/release_name
      - name: status_code
        valueFrom:
          path: /tmp/status_code
    retryStrategy:
      limit: "{{inputs.parameters.max_retries}}"
      retryPolicy: "OnFailure"
    container:
      image: alpine/k8s:1.30.14 
      command: ["/bin/bash", -c]
      args:
        - |
          # 解析配置参数
          CONFIG='{{inputs.parameters.config}}'
          MODEL_PATH=$(echo "$CONFIG" | jq -r '.deployment.model')
          MODEL_NAME=$(basename "$MODEL_PATH")
          ENGINE=$(echo "$CONFIG" | jq -r '.deployment.engine')
          NODE_SIZE=$(echo "$CONFIG" | jq -r '.deployment.node_size')
          TP=$(echo "$CONFIG" | jq -r '.deployment.tp')
          GPU=$(echo "$CONFIG" | jq -r '.deployment.gpu_per_node')
          PVC_NAME=$(cat /etc/config/model-pvc-map/$MODEL_NAME)
          EP=$(echo "$CONFIG" | jq -r '.deployment.ep')
          EP_ENABLE=$(echo "$CONFIG" | jq -r '.deployment.ep_enable')
          DP_ATTENTION=$(echo "$CONFIG" | jq -r '.deployment.dp_attention')

          # 生成唯一测试ID
          ARGO_POD_NAME="{{pod.name}}"
          TEST_ID="$ENGINE-${ARGO_POD_NAME: -20}"  # 截取后20个字符
          echo "$TEST_ID" > /tmp/release_name # 修复：为echo的参数加上引号
          
          # 记录开始时间
          START_TIME=$(date +%s)
          
          # Helm部署命令
          echo "[Deploy-Model] Starting deployment: $MODEL_NAME"
          echo "  Engine: $ENGINE, Nodes: $NODE_SIZE, GPUs/node: $GPU, TP: $TP, EP: $EP, DP_ATTENTION: $DP_ATTENTION"
          echo "  Chart path: {{inputs.parameters.chart_path}}/$ENGINE-deploy"
          
          set +e
          set -x

          helm_args=(
            "install"
            "$TEST_ID"
            "{{inputs.parameters.chart_path}}/$ENGINE-deploy"
            "--set" "nodeSize=$NODE_SIZE"
            "--set" "resourcesPerNode.gpu=$GPU"
            "--set" "llmConfig.tp=$TP"
            "--set" "llmConfig.dp=1"
            "--set" "leaderWorkerSet.restartPolicy=RecreateGroupOnPodRestart"
            "--set" "restartPolicy=Always"
            "--set" "model.pvcName=$PVC_NAME"
            "--set" "model.modelPath=$MODEL_PATH"
            "--set" "llmConfig.ep=$EP"
          )
          
          if [ "$EP_ENABLE" = "true" ]; then
            helm_args+=("--set" "llmConfig.enableEpMoe=true")
          fi

          if [ "$DP_ATTENTION" = "true" ]; then
            helm_args+=("--set" "llmConfig.enableDpAttention=true")
          fi

          helm_args+=("--timeout" "{{inputs.parameters.model_timeout}}s")
          helm_args+=("--atomic")
          
          # 直接执行命令数组，避免eval
          helm "${helm_args[@]}"

          DEPLOY_EXIT_CODE=$?
          
          # 记录部署结果
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            echo "Deployment failed for model: $MODEL_NAME after $DURATION seconds" # 修复：变量名MODEL改为MODEL_NAME
            # 记录失败信息
            FAIL_DIR="/shared-data/failed-tests/{{workflow.name}}"
            mkdir -p "$FAIL_DIR" # 修复：为mkdir的参数加上引号
            echo "$CONFIG" > "$FAIL_DIR/$TEST_ID-failed.json" # 修复：为echo的参数加上引号
            echo "Deployment failed after $DURATION seconds" >> "$FAIL_DIR/$TEST_ID-failed.json" # 修复：为echo的参数加上引号
            echo "----------------------------"
            echo "false" > /tmp/status_code
          else
            echo "Successfully deployed model: $MODEL_NAME in $DURATION seconds" # 修复：变量名MODEL改为MODEL_NAME
            echo "----------------------------"
            echo "success" > /tmp/status_code
          fi
      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data
      - name: model-pvc-map
        mountPath: /etc/config/model-pvc-map
