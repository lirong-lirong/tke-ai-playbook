apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: consolidate-reports
spec:
  entrypoint: consolidate-reports
  templates:
  - name: consolidate-reports
    container:
      image: python:3.9-slim
      command: [sh, -c]
      args:
        - |
          pip install -i https://mirrors.cloud.tencent.com/pypi/simple pandas requests > /dev/null
          python /scripts/consolidate_reports.py
      env:
        - name: WORKFLOW_DIR
          value: "/shared-data/reports/{{workflow.name}}"
        - name: OUTPUT_DIR
          value: "/shared-data/reports/{{workflow.name}}/summary"
        - name: DASHBOARD_URL
          value: "http://llm-dashboard-service:8080/api/reports"
        - name: DASHBOARD_API_KEY
          value: "your-secret-api-key"
        - name: SEND_TO_DASHBOARD
          value: "true"
      volumeMounts:
      - name: scripts
        mountPath: /scripts