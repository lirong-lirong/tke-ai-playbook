apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: pressure-test-operator
spec:
  entrypoint: pressure-test
  arguments:
    parameters:
    - name: config
    - name: release_name
    - name: pre_status
    - name: ISL
    - name: OSL
    - name: concurrency
    - name: test_timeout
    - name: helm_chart_path
      default: "/shared-data/helm-chart/vllm-benchmark"
    - name: workflow_name
    - name: namespace
      default: "default"
  
  templates:
  - name: pressure-test
    inputs:
      parameters:
      - name: config
      - name: release_name
      - name: pre_status
      - name: ISL
      - name: OSL
      - name: concurrency
      - name: test_timeout
      - name: helm_chart_path
      - name: workflow_name
      - name: namespace
    outputs:
      parameters:
      - name: status_code
        valueFrom:
          path: /tmp/status_code
      - name: report_path
        valueFrom:
          path: /tmp/report_path
    container:
      image: alpine/k8s:1.30.14 
      command: [sh, "-c"]
      args:
        - |
          # 初始化状态
          echo "false" > /tmp/status_code
          echo "unknown" > /tmp/report_path
          
          # 跳过条件
          if [ "{{inputs.parameters.pre_status}}" = "false" ]; then
            echo "Skipping pressure test due to previous failure"
            exit 0
          fi
          
          # 解析测试参数
          CONFIG='{{inputs.parameters.config}}'
          MODEL_PATH=$(echo "$CONFIG" | jq -r '.deployment.model')
          MODEL_NAME=$(basename "$MODEL_PATH")  
          ENGINE=$(echo "$CONFIG" | jq -r '.deployment.engine')
          TOKENIZER=$(echo "$CONFIG" | jq -r '.test.tokenizer')
          GPU=$(echo "$CONFIG" | jq -r '.deployment.gpu_per_node')
          NODE_SIZE=$(echo "$CONFIG" | jq -r '.deployment.node_size')
          TP=$(echo "$CONFIG" | jq -r '.deployment.tp')
          ISL="{{inputs.parameters.ISL}}"
          OSL="{{inputs.parameters.OSL}}"
          CONCURRENCY="{{inputs.parameters.concurrency}}"
          TEST_TIMEOUT="{{inputs.parameters.test_timeout}}"
          HELM_CHART_PATH="{{inputs.parameters.helm_chart_path}}"
          RELEASE_NAME="{{inputs.parameters.release_name}}-test"
          
          # 记录开始时间
          START_TIME=$(date +%s)
          
          # 获取模型服务名称
          SERVICE_NAME=$(kubectl get svc \
            -l app.kubernetes.io/instance={{inputs.parameters.release_name}} \
            -n {{inputs.parameters.namespace}} \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          # 报告路径
          REPORT_DIR="/shared-data/reports/{{inputs.parameters.workflow_name}}/${MODEL_NAME}_${ENGINE}_ns${NODE_SIZE}_gpu${GPU}_tp${TP}"
          mkdir -p "$REPORT_DIR"
          echo "$REPORT_DIR" > /tmp/report_path
          
          # 运行压力测试
          echo "Starting pressure test for $MODEL_NAME-$ENGINE"
          echo "  Service: $SERVICE_NAME"
          echo "  Input Length: $ISL, Output Length: $OSL, Concurrency: $CONCURRENCY"
          echo "  Timeout: ${TEST_TIMEOUT}s"
          
          set -x
          helm install "$RELEASE_NAME" "$HELM_CHART_PATH" \
            --set config.model="$MODEL_NAME" \
            --set config.outputPath="$REPORT_DIR" \
            --set tokenizer.hostPath="$TOKENIZER" \
            --set serviceInfo.name="$SERVICE_NAME" \
            --set serviceInfo.attempts=10 \
            --set config.ISL="$ISL" \
            --set config.OSL="$OSL" \
            --namespace "{{inputs.parameters.namespace}}" \
            --timeout "${TEST_TIMEOUT}s" \
            --wait 
          
          HELM_EXIT_CODE=$?
          set +x
          
          # 计算持续时间
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          if [ $HELM_EXIT_CODE -ne 0 ]; then
            echo "❌ Pressure test failed for $MODEL_NAME after ${DURATION}s"
            # 记录失败信息
            FAIL_DIR="/shared-data/failed-tests/{{inputs.parameters.workflow_name}}"
            mkdir -p "$FAIL_DIR"
            echo "$CONFIG" > "$FAIL_DIR/$TEST_ID-failed.json"
            echo "Pressure test failed after ${DURATION}s" >> "$FAIL_DIR/$TEST_ID-failed.json"
            echo "false" > /tmp/status_code
          else
            echo "✅ Successfully completed pressure test for $MODEL_NAME in ${DURATION}s"
            echo "true" > /tmp/status_code
          fi
          echo "----------------------------------------"
      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data