apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: pressure-test-operator
spec:
  entrypoint: pressure-test
  arguments:
    parameters:
    - name: pre_status
    - name: configs_json
  
  templates:
  - name: pressure-test
    inputs:
      parameters:
      - name: configs_json
      - name: pre_status
    outputs:
      parameters:
      - name: status_code
        valueFrom:
          path: /tmp/status_code
      # - name: report_path
      #   valueFrom:
      #     path: /tmp/report_path
    script:
      image: fanjiankong-bj.tencentcloudcr.com/pengdrumli/evalscpoe-perf:v0.4
      command: [python]
      source: |
        import os
        import json
        import sys
        from evalscope.perf.main import run_perf_benchmark
        from evalscope.perf.arguments import Arguments

        CONFIG_MAP_MODEL_PVC_PATH = "/etc/test-parameters"
        def read_param_from_model_pvc_map(param_name, default_value=''):
            file_path = os.path.join(CONFIG_MAP_MODEL_PVC_PATH, param_name)
            if os.path.exists(file_path):
                try:
                    with open(file_path, 'r', encoding='utf-8') as f:
                        content = f.read().strip()
                        return content if content else default_value
                except Exception as e:
                    print(f"Error reading {file_path}: {e}. Returning default value.")
                    return default_value
            return default_value
        
        configs_json_str = '{{inputs.parameters.configs_json}}'
        pre_status = "{{inputs.parameters.pre_status}}"

        if pre_status.lower() == 'false':
            print("pre_status 为 false，跳过性能测试。")
            sys.exit(0) # 正常退出脚本，Argo Workflow 任务将完成
        with open("/tmp/status_code", "w") as f:
            f.write("false")

        config = json.loads(configs_json_str)
        deployment_cfg = config.get("deployment", {})
        test_cfg = config.get("test", {})

        name = deployment_cfg.get("name")
        model = deployment_cfg.get("model", "default-model") # 使用部署模型
        tokenizer = test_cfg.get("tokenizer", model) # 使用测试 tokenizer，如果没有则回退到部署模型
        dataset = test_cfg.get("dataset", "random")
        dataset_path = test_cfg.get("dataset_path", "")
        isl = test_cfg.get("ISL")
        osl = test_cfg.get("OSL")
        eos = str(test_cfg.get("EOS", True)) # 确保它是字符串以便比较
        service = test_cfg.get("service", "127.0.0.1")
        service_port = test_cfg.get("service_port", 8801)

        ignore_eos = True if eos.lower() == 'false' else False
        url = f"http://{service}:{service_port}/v1/chat/completions"

        swanlab_api_key = read_param_from_model_pvc_map('swanlab_api_key', default_value=os.getenv('SWANLAB_API_KEY', ''))
        swanlab_host = read_param_from_model_pvc_map('swanlab_host', default_value=os.getenv('SWANLAB_HOST', ''))

        # Initialize Arguments with common parameters
        task_cfg_args = {
            'parallel': [1, 10, 50, 100, 200],
            'number': [10, 20, 100, 200, 400],
            'model': model,
            'url': url,
            'api': 'openai',
            'tokenizer_path': model,
            'extra_args': {'ignore_eos': ignore_eos},
            'swanlab_api_key': swanlab_api_key,
            'swanlab_host': swanlab_host,
            'name': name
        }

        if dataset == 'random':
            # For random dataset, ISL corresponds to max_prompt_length and min_prompt_length
            # OSL corresponds to min_tokens and max_tokens
            # dataset_path is not used
            task_cfg_args['dataset'] = 'random'
            task_cfg_args['min_prompt_length'] = int(isl) - 20
            task_cfg_args['max_prompt_length'] = int(isl) + 20
            task_cfg_args['min_tokens'] = int(osl) - 20
            task_cfg_args['max_tokens'] = int(osl) + 20# OSL applies to both min/max
        elif dataset == 'custom':
            # For custom dataset, dataset_path is used, and ISL is not applicable
            task_cfg_args['dataset'] = 'custom'
            task_cfg_args['dataset_path'] = '/dataset/' + dataset_path
            # ISL related parameters (min_prompt_length, max_prompt_length) are not set
            # min_tokens and max_tokens still apply for response generation
            task_cfg_args['min_tokens'] = int(osl) - 20
            task_cfg_args['max_tokens'] = int(osl) + 20
        else:
            raise ValueError(f"Unsupported dataset type: {dataset}. Must be 'random' or 'custom'.")

        task_cfg = Arguments(**task_cfg_args)
        results = run_perf_benchmark(task_cfg)
        with open("/tmp/status_code", "w") as f:
            f.write("true")

      volumeMounts:
      - name: shared-pvc
        mountPath: /shared-data
      - name: model-pvc-map
        mountPath: /etc/config/model-pvc-map
      - name: test-parameters-config
        mountPath: /etc/test-parameters
      - name: dataset-pvc
        mountPath: /dataset